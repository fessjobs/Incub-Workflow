# Railway-Konfiguration für incub:workflow
# Einsatzmodul: zusätzlich APP_BASE_URL (öffentliche Domain) setzen; der Job-Worker
# (Link-Versand, PDFs) läuft im Server-Prozess. Optional Railway-Cron auf
# POST /api/jobs/run mit "Authorization: Bearer $JOBS_SECRET".
# Railway baut das Image über das vorhandene Dockerfile. Der Entrypoint
# (docker-entrypoint.sh) wendet beim Start automatisch die DB-Migrationen an
# und legt Grunddaten an (Admin, Firmen, Kategorien).
[build]
builder = "dockerfile"

[deploy]
# Healthcheck wartet, bis der Server nach Migration + Seed erreichbar ist
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
