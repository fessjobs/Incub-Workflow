# incubWorkflow – lokaler Betrieb (Version 1)
# Start:  docker compose up -d --build
# App:    http://localhost:3000  (im lokalen Netz: http://<Rechner-IP>:3000)
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: incubworkflow
      POSTGRES_USER: incubworkflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-incubworkflow}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incubworkflow -d incubworkflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://incubworkflow:${POSTGRES_PASSWORD:-incubworkflow}@db:5432/incubworkflow
      AUTH_SECRET: ${AUTH_SECRET:-bitte-aendern-mindestens-32-zeichen-lang}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@incub.live}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-incub2026!}
      ADMIN_NAME: ${ADMIN_NAME:-Maik Janke}
      STORAGE_PATH: /data/incubWorkflow-Ablage
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-4-8}
    volumes:
      # Beleg-Ablage auf dem Host, damit die PDFs direkt im Dateisystem liegen
      - ./incubWorkflow-Ablage:/data/incubWorkflow-Ablage

volumes:
  db-data:
